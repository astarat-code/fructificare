# Build public et reproductible de l'application : Windows, Linux et macOS (expérimental).
#
# POURQUOI UNE CI PUBLIQUE : les binaires ne sont pas signés par un certificat de
# signature de code. La CI est ce qui permet à un utilisateur de rattacher un exécutable
# publié à un commit vérifiable — le journal de build est public, et les empreintes
# SHA-256 sont calculées ici, pas sur la machine du mainteneur.
#
# ─── CE WORKFLOW EST LA CIBLE LA PLUS INTÉRESSANTE DU PROJET ────────────────────────
#
# Compromettre l'application chez un utilisateur ne donne accès qu'à un patrimoine.
# Compromettre ce fichier donne accès à TOUS les utilisateurs à la fois, sous la forme
# d'un .exe publié sous le nom du projet, accompagné d'une empreinte SHA-256 calculée
# par la CI elle-même — la vérification que l'on recommande aux utilisateurs confirmerait
# alors le binaire piégé. D'où les deux règles suivantes, qui ne doivent pas être
# assouplies « pour simplifier » :
#
#   1. TOUTES LES ACTIONS SONT ÉPINGLÉES PAR SHA DE COMMIT, jamais par étiquette.
#      Une étiquette (`@v2`) et a fortiori une branche (`@stable`) sont mutables : celui
#      qui prend le contrôle d'un dépôt d'action la déplace et exécute son code ici.
#      Le commentaire à droite rappelle la version, Dependabot (github-actions, voir
#      .github/dependabot.yml) propose les mises à jour de SHA.
#
#   2. LE JETON D'ÉCRITURE EST ISOLÉ DANS UN JOB QUI NE COMPILE RIEN.
#      Les jobs `windows`, `linux` et `macos` exécutent `npm ci` — donc les scripts
#      d'installation de dépendances tierces — et `cargo build`. Ils sont en lecture
#      seule. Seul `publier`, qui se contente de télécharger des artefacts déjà construits,
#      porte `contents: write`. Une dépendance compromise n'a donc aucun jeton à voler.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Défaut restrictif : chaque job ré-accorde ce dont il a besoin, et rien de plus.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Aucune permission d'écriture : ce job exécute du code tiers (npm ci, cargo).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: frontend/src-tauri

      # npm ci — installe exactement les versions verrouillées, sans résolution de plages.
      # --ignore-scripts (B-09) : ce job exécute déjà du code tiers à la compilation, mais
      # rien n'oblige à exécuter EN PLUS les scripts d'installation npm, inutiles ici.
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --ignore-scripts

      # Bloquant, comme dans ci.yml. Une version n'a pas à être moins exigeante que le
      # contrôle d'une pull request : c'est la seule sortie qui atteint les utilisateurs.
      - name: Vérifier les vulnérabilités connues
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # L'ACL Tauri décide de ce que la webview peut atteindre. Une permission trop
      # large ici annulerait les protections applicatives : contrôle avant compilation.
      - name: Vérifier l'ACL Tauri
        working-directory: frontend
        run: node scripts/check-capabilities.js

      - name: Tester la règle d'imposition des ventes
        working-directory: frontend
        run: npm run test:rules

      - name: Tests de sécurité
        working-directory: frontend
        run: npm run test:security

      - name: Compiler l'application
        working-directory: frontend
        run: npm run tauri build

      # Le garde de navigation (B-02) vit côté Rust : il faut le tester côté Rust.
      # APRÈS la compilation, et c'est obligatoire : generate_context!() embarque le
      # dossier frontend/build au moment de compiler, y compris pour les tests. Placée
      # avant, cette étape échouerait sur un runner neuf, où build/ n'existe pas encore.
      - name: Tests Rust
        working-directory: frontend/src-tauri
        run: cargo test --lib

      - name: Calculer les empreintes SHA-256
        working-directory: frontend/src-tauri/target/release
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item fructificare.exe (Join-Path $out "Fructificare.exe")
          Get-ChildItem bundle/nsis -Filter *setup.exe | Copy-Item -Destination $out
          Get-ChildItem $out -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path (Join-Path $out "SHA256SUMS-windows.txt") -Encoding ascii
          Get-Content (Join-Path $out "SHA256SUMS-windows.txt")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fructificare-windows
          path: frontend/src-tauri/target/release/artifacts/*

  # Ubuntu 22.04 plutôt que la plus récente : un binaire Linux lié à une glibc récente
  # refuse de démarrer sur une distribution plus ancienne. Compiler sur la plus ancienne
  # version encore maintenue élargit le parc compatible (Debian 12, Ubuntu 22.04 et après).
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: frontend/src-tauri

      # WebKitGTK est le moteur d'affichage de Tauri sous Linux ; xvfb fournit l'écran
      # virtuel du test de lancement ci-dessous.
      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Vérifier l'ACL Tauri
        working-directory: frontend
        run: node scripts/check-capabilities.js

      - name: Compiler l'application
        working-directory: frontend
        run: npm run tauri build -- --bundles appimage,deb

      - name: Tests Rust
        working-directory: frontend/src-tauri
        run: cargo test --lib

      # Compiler ne prouve pas que l'application démarre : une bibliothèque manquante ou
      # une panique au lancement passeraient inaperçues. Toujours vivante après 20 s sur
      # un écran virtuel → `timeout` rend 124. Tout autre code est un arrêt prématuré.
      # En cas d'échec, la sortie de l'application est publiée en annotation : le journal
      # d'un job n'est lisible que connecté, une annotation l'est publiquement.
      - name: Tester le lancement
        working-directory: frontend/src-tauri/target/release
        run: |
          set +e
          journal="$RUNNER_TEMP/lancement.log"
          xvfb-run -a timeout 20s ./fructificare > "$journal" 2>&1
          code=$?
          if [ "$code" -eq 124 ]; then echo "L'application tourne toujours après 20 s."; exit 0; fi
          cat "$journal"
          echo "::error title=Lancement Linux (code $code)::$(tail -n 40 "$journal" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 1

      - name: Calculer les empreintes SHA-256
        working-directory: frontend/src-tauri/target/release/bundle
        run: |
          mkdir -p ../artifacts
          cp appimage/*.AppImage deb/*.deb ../artifacts/
          cd ../artifacts
          sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fructificare-linux
          path: frontend/src-tauri/target/release/artifacts/*

  # EXPÉRIMENTAL : ni signé par un certificat Apple ni notarié, et testé seulement par
  # la CI. Signature ad hoc (tauri.conf.json, macOS.signingIdentity « - ») : sans aucune
  # signature, macOS tue un binaire Apple Silicon au lancement. Un binaire universel
  # couvre les Mac Intel et Apple Silicon avec un seul fichier.
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: frontend/src-tauri

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Vérifier l'ACL Tauri
        working-directory: frontend
        run: node scripts/check-capabilities.js

      - name: Compiler l'application
        working-directory: frontend
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - name: Tests Rust
        working-directory: frontend/src-tauri
        run: cargo test --lib

      - name: Tester le lancement
        working-directory: frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          set +e
          journal="$RUNNER_TEMP/lancement.log"
          app=$(ls -d *.app | head -1)
          "$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" > "$journal" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; echo "L'application tourne toujours après 20 s."; exit 0
          fi
          wait "$pid"; code=$?
          cat "$journal"
          echo "::error title=Lancement macOS (code $code)::$(tail -n 40 "$journal" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 1

      - name: Calculer les empreintes SHA-256
        working-directory: frontend/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          mkdir -p ../artifacts
          cp dmg/*.dmg ../artifacts/
          cd ../artifacts
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fructificare-macos
          path: frontend/src-tauri/target/universal-apple-darwin/release/artifacts/*

  # Job séparé, et c'est tout l'intérêt : il ne compile rien, n'installe aucune
  # dépendance, n'exécute aucun code tiers. Il télécharge les artefacts des jobs
  # précédents et les publie. C'est le seul endroit du dépôt où un jeton d'écriture existe.
  publier:
    needs: [windows, linux, macos]
    # macOS est expérimental : son échec ne bloque pas la publication de Windows et Linux.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/')
      && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fructificare-*
          merge-multiple: true
          path: artifacts

      # Aucune empreinte n'est calculée ici : chaque job de compilation a calculé les
      # siennes, on les réunit dans le fichier unique que citent les notes de version.
      - name: Rassembler les empreintes
        run: |
          cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt
          rm artifacts/SHA256SUMS-*.txt
          cat artifacts/SHA256SUMS.txt

      # En brouillon : la version n'est visible qu'une fois relue et publiée à la main
      # (notes, fichiers joints, empreintes). Un tag poussé par erreur ne publie rien.
      - name: Publier la version
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: artifacts/*
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed.

            **Windows:** download `Fructificare_*_x64-setup.exe`. The binaries are not code-signed
            yet, so Windows SmartScreen may warn you: choose *More info → Run anyway*.
            Before running it, check its fingerprint:

            ```powershell
            Get-FileHash .\Fructificare_*_x64-setup.exe -Algorithm SHA256
            ```

            and compare it with `SHA256SUMS.txt`. The fingerprints are computed by the CI, whose
            build log is public.

            **Linux:** download the `.AppImage` (any distribution: make it executable, then run
            it; on Ubuntu 24.04 and later, install `libfuse2` first), or the `.deb` for Debian,
            Ubuntu and derivatives. Check it with `sha256sum -c SHA256SUMS.txt --ignore-missing`.

            **macOS — experimental:** download the `.dmg` (one file for Intel and Apple Silicon)
            and drag Fructificare into Applications. It is not signed by Apple: on first launch,
            open *System Settings → Privacy & Security* and click *Open Anyway*. This build is
            only tested by the CI so far; reports from Mac users are very welcome. Check it with
            `shasum -a 256 Fructificare_*.dmg`.

            ---

            **Windows :** téléchargez `Fructificare_*_x64-setup.exe`. Les binaires ne sont pas
            encore signés : SmartScreen peut afficher un avertissement, choisissez
            *Informations complémentaires → Exécuter quand même*. Avant de l'exécuter, vérifiez
            son empreinte avec la commande ci-dessus et comparez-la avec `SHA256SUMS.txt`.

            **Linux :** téléchargez l'`.AppImage` (toutes distributions : rendez-le exécutable puis
            lancez-le ; sur Ubuntu 24.04 et suivantes, installez d'abord `libfuse2`), ou le `.deb`
            pour Debian, Ubuntu et dérivées.

            **macOS — expérimental :** téléchargez le `.dmg` (un seul fichier pour Intel et Apple
            Silicon) et glissez Fructificare dans Applications. Il n'est pas signé par Apple : au
            premier lancement, ouvrez *Réglages Système → Confidentialité et sécurité* et cliquez
            sur *Ouvrir quand même*. Cette version n'est encore testée que par la CI : les retours
            d'utilisateurs Mac sont les bienvenus.
