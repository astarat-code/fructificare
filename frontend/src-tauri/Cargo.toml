[package]
name = "fructificare"
version = "1.0.0"
description = "Fructificare — suivi de portefeuille, 100 % local et privé"
authors = ["astarat-code and Fructificare contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/astarat-code/fructificare"
edition = "2021"
rust-version = "1.77"

# Le binaire de l'app. `name` détermine le nom de l'exécutable (Fructificare.exe
# est renommé via productName dans tauri.conf.json au moment du bundle).
[lib]
name = "fructificare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimisation du binaire de release : taille + démarrage plus rapides.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
