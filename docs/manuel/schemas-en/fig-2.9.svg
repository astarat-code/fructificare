<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EFAD24"/>
    </marker>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1F1943" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="760" rx="24" fill="#F8FAFC"/>

  <!-- Ring and arrows (circle centred on 500,400, radius 275) -->
  <circle cx="500" cy="400" r="275" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 8"/>
  <g fill="none" stroke="#EFAD24" stroke-width="5" stroke-linecap="round" marker-end="url(#fleche)">
    <path d="M 617.1 151.2 A 275 275 0 0 1 691.8 202.9"/>
    <path d="M 772.8 434.5 A 275 275 0 0 1 746.7 521.5"/>
    <path d="M 551.5 670.1 A 275 275 0 0 1 460.6 672.2"/>
    <path d="M 259 532.5 A 275 275 0 0 1 229 446.7"/>
    <path d="M 299.5 211.7 A 275 275 0 0 1 371.9 156.7"/>
  </g>

  <!-- Centre -->
  <circle cx="500" cy="400" r="112" fill="#1F1943" filter="url(#ombre)"/>
  <text x="500" y="392" text-anchor="middle" font-size="30" font-weight="700" fill="#EFAD24">Fructificare</text>
  <text x="500" y="424" text-anchor="middle" font-size="19" fill="#E2E8F0">every month</text>

  <!-- Steps: vertices of a pentagon. Title, two-line caption, chapter reference. -->
  <g text-anchor="middle">
    <g transform="translate(500,125)">
      <circle r="102" fill="#FFFFFF" stroke="#1F1943" stroke-width="4" filter="url(#ombre)"/>
      <text y="-36" font-size="26" font-weight="700" fill="#1F1943">Record</text>
      <text y="-6" font-size="17" fill="#334155">your deposits</text>
      <text y="15" font-size="17" fill="#334155">and withdrawals</text>
      <rect x="-66" y="30" width="132" height="26" rx="13" fill="#FDF3DC"/>
      <text y="48" font-size="14.5" font-weight="600" fill="#1F1943">chapters 5, 7 and 8</text>
    </g>
    <g transform="translate(761.5,315)">
      <circle r="102" fill="#FFFFFF" stroke="#1F1943" stroke-width="4" filter="url(#ombre)"/>
      <text y="-36" font-size="26" font-weight="700" fill="#1F1943">Calibrate</text>
      <text y="-6" font-size="17" fill="#334155">the real value</text>
      <text y="15" font-size="17" fill="#334155">of your accounts</text>
      <rect x="-66" y="30" width="132" height="26" rx="13" fill="#FDF3DC"/>
      <text y="48" font-size="14.5" font-weight="600" fill="#1F1943">chapter 6</text>
    </g>
    <g transform="translate(661.6,622.5)">
      <circle r="102" fill="#FFFFFF" stroke="#1F1943" stroke-width="4" filter="url(#ombre)"/>
      <text y="-36" font-size="26" font-weight="700" fill="#1F1943">Measure</text>
      <text y="-6" font-size="17" fill="#334155">performance</text>
      <text y="15" font-size="17" fill="#334155">and fees</text>
      <rect x="-66" y="30" width="132" height="26" rx="13" fill="#FDF3DC"/>
      <text y="48" font-size="14.5" font-weight="600" fill="#1F1943">chapters 4 and 5</text>
    </g>
    <g transform="translate(338.4,622.5)">
      <circle r="102" fill="#FFFFFF" stroke="#1F1943" stroke-width="4" filter="url(#ombre)"/>
      <text y="-36" font-size="26" font-weight="700" fill="#1F1943">Optimize</text>
      <text y="-6" font-size="17" fill="#334155">profits</text>
      <text y="15" font-size="17" fill="#334155">and fees</text>
      <rect x="-66" y="30" width="132" height="26" rx="13" fill="#FDF3DC"/>
      <text y="48" font-size="14.5" font-weight="600" fill="#1F1943">chapters 10 and 11</text>
    </g>
    <g transform="translate(238.5,315)">
      <circle r="102" fill="#FFFFFF" stroke="#1F1943" stroke-width="4" filter="url(#ombre)"/>
      <text y="-36" font-size="26" font-weight="700" fill="#1F1943">Forecast</text>
      <text y="-6" font-size="17" fill="#334155">the long-term</text>
      <text y="15" font-size="17" fill="#334155">trajectory</text>
      <rect x="-66" y="30" width="132" height="26" rx="13" fill="#FDF3DC"/>
      <text y="48" font-size="14.5" font-weight="600" fill="#1F1943">chapter 10</text>
    </g>
  </g>
</svg>
